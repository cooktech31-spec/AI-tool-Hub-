  .pfbtn{padding:4px 12px;border:1px solid #e0e0d8;border-radius:6px;font-size:12px;color:#555;cursor:pointer;background:#fff;transition:all .15s}

  .section-title{font-size:13px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:30px}

  .badge.paid{background:#FAECE7;color:#712B13}
  .badge.freemium{background:#FAEEDA;color:#633806}

  .tool-desc{font-size:12px;color:#666;line-height:1.5}
  .uses{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
  .use-chip{background:#f0f0ea;color:#555;font-size:11px;padding:2px 8px;border-radius:5px}
  .open-btn{margin-top:auto;padding:8px 0;background:#1a1a18;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;text-decoration:none}
  .open-btn:hover{background:#333}
  .open-btn svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .header-stats{display:none}
    main{padding:14px}

let activeCat = 'all';
let activePrice = 'all';

function renderTools(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const grid = document.getElementById('toolGrid');
  const filtered = tools.filter(t=>{
    const catOk = activeCat==='all' || t.cat===activeCat;
    const priceOk = activePrice==='all' || t.price===activePrice;
    const searchOk = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.uses.join(' ').toLowerCase().includes(q) || t.cat.includes(q);
    return catOk && priceOk && searchOk;
  });
  document.getElementById('toolCount').textContent = tools.length;
  document.getElementById('resultsLabel').textContent = filtered.length + ' tools mile';
  if(filtered.length===0){
    grid.innerHTML='<div class="no-res">😕 Koi tool nahi mila "<b>'+document.getElementById('searchBox').value+'</b>" ke liye<br><small>Kuch aur search karo ya category change karo</small></div>';
    return;
  }
  grid.innerHTML = filtered.map(t=>`
    <div class="card">
      <div class="card-top">
        <div class="tool-icon" style="background:${t.bg}">${t.icon}</div>
        <span class="badge ${t.price}">${t.price==='free'?'🟢 Free':t.price==='paid'?'🔴 Paid':'🟡 Freemium'}</span>
      </div>
      <div class="cat-tag">${t.cat.toUpperCase()}</div>
      <div class="tool-name">${t.name}</div>
      <div class="tool-desc">${t.desc}</div>
      <div class="uses">${t.uses.map(u=>`<span class="use-chip">${u}</span>`).join('')}</div>
      <a class="open-btn" href="${t.url}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Seedha Open karo
      </a>
    </div>
  `).join('');
}

function applyFilters(){renderTools()}
function setCat(cat,btn){
  activeCat=cat;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTools();
}
function setPrice(p,btn){
  activePrice=p;
  document.querySelectorAll('.pfbtn').forEach(b=>b.className='pfbtn');
  btn.classList.add('active-'+p);
  renderTools();
}

renderTools();
